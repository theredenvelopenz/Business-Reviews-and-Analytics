<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>How was your visit?</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<script>
  /* ============================================================
     CONFIG — must match the values in admin.html.
     ============================================================ */
  const SUPABASE_URL = "https://lhhkbycnstsrlqexugoj.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_tEm1Jerp_SGC0SxtckYAjw_QDf-3taq";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const params = new URLSearchParams(window.location.search);
  const bizId = params.get('b');
</script>

<style>
  :root{
    --ink:#1a1a1a; --paper:#f7f8fa; --panel:#ffffff; --line:#e3e5e9;
    --gold:#f5a623; --gold-dim:#dcdfe4; --blue:#2f5fe0; --blue-dark:#274fc0;
    --muted:#6b7280; --radius:12px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:32px 20px; -webkit-tap-highlight-color:transparent;
  }
  .card{
    width:100%; max-width:440px; background:var(--panel);
    border:1px solid var(--line); border-radius:16px;
    padding:32px 28px; text-align:center;
  }
  .stars{ display:flex; justify-content:center; gap:8px; margin:0 0 22px; }
  .star{
    font-size:2rem; line-height:1; color:var(--gold-dim); background:none; border:none;
    padding:2px; cursor:pointer; transition:transform .12s ease, color .12s ease;
  }
  .star:active{ transform:scale(0.9); }
  .star.filled{ color:var(--gold); }

  h1{ font-size:1.35rem; font-weight:700; margin:0 0 6px; }
  .sub{ font-size:0.92rem; color:var(--muted); margin:0 0 24px; line-height:1.4; }

  .panel{ display:none; text-align:left; }
  .panel.active{ display:block; }

  label{ display:block; font-size:0.85rem; font-weight:700; margin:0 0 6px; }
  input, textarea{
    width:100%; border:1px solid var(--line); border-radius:8px;
    padding:11px 13px; font-family:var(--sans); font-size:0.92rem;
    color:var(--ink); background:#fff; margin-bottom:16px;
  }
  input::placeholder, textarea::placeholder{ color:#a7abb3; }
  textarea{ min-height:88px; resize:vertical; }
  input:focus, textarea:focus{ outline:2px solid var(--blue); outline-offset:1px; border-color:transparent; }

  .privacy-note{ font-size:0.76rem; color:var(--muted); margin:-8px 0 16px; }

  button.action{
    width:100%; font-family:var(--sans); font-size:0.98rem; font-weight:700;
    padding:14px 18px; border-radius:8px; cursor:pointer; transition:opacity .15s ease;
  }
  button.action:active{ opacity:0.88; }
  button.action:disabled{ opacity:0.55; cursor:default; }
  .btn-blue{ background:var(--blue); color:#fff; border:none; }
  .btn-blue:hover{ background:var(--blue-dark); }
  .btn-outline{ background:#fff; color:var(--ink); border:1px solid var(--line); }

  .divider{ display:flex; align-items:center; gap:12px; margin:18px 0; color:var(--muted); font-size:0.78rem; font-weight:600; letter-spacing:0.04em; }
  .divider::before, .divider::after{ content:""; flex:1; height:1px; background:var(--line); }

  .thanks{ font-size:0.94rem; color:#2f7a4f; text-align:center; margin:0 0 16px; }
  .error, .loading{ font-family:var(--sans); color:var(--muted); font-size:0.92rem; }

  :focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ .star{ transition:none; } }
</style>

<div class="card" id="card">
  <p class="loading">Loading…</p>
</div>

<script>
  const card = document.getElementById('card');

  async function init(){
    if(!bizId){
      card.innerHTML = '<p class="error">This link is missing a business ID.</p>';
      return;
    }

    const { data: business, error } = await sb
      .from('businesses')
      .select('*')
      .eq('id', bizId)
      .single();

    if(error || !business){
      console.error('Supabase error loading business:', error);
      const detail = error ? (error.message + (error.code ? ' (code: ' + error.code + ')' : '')) : 'no matching business';
      card.innerHTML = '<p class="error">This review page isn\'t set up yet.<br><br>' +
        'Looking for ID: <code>' + escapeHtml(bizId) + '</code><br>' +
        'Detail: ' + escapeHtml(detail) + '</p>';
      return;
    }

    renderPage(business);
  }

  function renderPage(business){
    card.innerHTML = `
      <div class="stars" id="stars" role="radiogroup" aria-label="Star rating"></div>

      <div id="promptPanel">
        <h1>How was your visit?</h1>
        <p class="sub">${escapeHtml(business.name)} — tap a star to rate us.</p>
      </div>

      <div class="panel" id="panelForm">
        <h1 id="heading">We want to make this right</h1>
        <p class="sub" id="subheading">Please let us know how we can improve your experience.</p>

        <label for="fName">Your Name</label>
        <input type="text" id="fName">

        <label for="fEmail">Contact Email</label>
        <input type="email" id="fEmail">

        <label for="fMessage">Message</label>
        <textarea id="fMessage" placeholder="What went wrong and how can we fix it?"></textarea>

        <p class="privacy-note">Name and email are optional — used only to follow up on your feedback, kept private, and never shared publicly. See our <a href="privacy.html" target="_blank" style="color:inherit;">Privacy Policy</a>.</p>

        <p class="error" id="submitError" style="display:none; margin:0 0 12px;"></p>

        <button class="action btn-blue" type="button" id="submitFeedback">Send Private Feedback</button>

        <div class="divider">OR</div>

        <button class="action btn-outline" type="button" id="goToGoogleLow">Leave a Public Google Review</button>
      </div>

      <div class="panel" id="panelHigh">
        <h1>So glad you had a great visit!</h1>
        <p class="sub">We'd love it if you shared that on Google.</p>
        <button class="action btn-blue" type="button" id="goToGoogleHigh">Leave a Public Google Review</button>
      </div>

      <div class="panel" id="panelDone">
        <p class="thanks">Thank you — your feedback has been sent to the team.</p>
        <div class="divider">OR</div>
        <button class="action btn-outline" type="button" id="goToGoogleAfter">Leave a Public Google Review</button>
      </div>
    `;

    const starsEl = document.getElementById('stars');
    const promptPanel = document.getElementById('promptPanel');
    const panelForm = document.getElementById('panelForm');
    const panelHigh = document.getElementById('panelHigh');
    const panelDone = document.getElementById('panelDone');
    const heading = document.getElementById('heading');
    const subheading = document.getElementById('subheading');

    let selected = 0;

    for(let i=1;i<=5;i++){
      const btn = document.createElement('button');
      btn.className = 'star';
      btn.type = 'button';
      btn.textContent = '★';
      btn.setAttribute('role','radio');
      btn.setAttribute('aria-checked','false');
      btn.setAttribute('aria-label', i + ' star' + (i>1?'s':''));
      btn.addEventListener('click', () => selectRating(i));
      starsEl.appendChild(btn);
    }

    function paintStars(n){
      [...starsEl.children].forEach((el,idx)=>{
        const on = idx < n;
        el.classList.toggle('filled', on);
        el.setAttribute('aria-checked', on ? 'true':'false');
      });
    }

    function goToGoogle(){
      // Log the rating for internal analytics even if no private
      // feedback was submitted, then send them to the real review.
      sb.from('feedback').insert({ business_id: business.id, rating: selected || null }).then(()=>{});
      window.location.href = business.google_review_url;
    }

    function selectRating(n){
      selected = n;
      paintStars(n);
      promptPanel.style.display = 'none';
      panelDone.classList.remove('active');
      panelForm.classList.remove('active');
      panelHigh.classList.remove('active');

      if(n <= 3){
        heading.textContent = "We want to make this right";
        subheading.textContent = "Please let us know how we can improve your experience.";
        panelForm.classList.add('active');
      } else {
        panelHigh.classList.add('active');
      }
    }

    document.getElementById('submitFeedback').addEventListener('click', async (e) => {
      const btn = e.target;
      const errorEl = document.getElementById('submitError');
      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Sending…';

      const name = document.getElementById('fName').value.trim();
      const email = document.getElementById('fEmail').value.trim();
      const message = document.getElementById('fMessage').value.trim();

      const { error } = await sb.from('feedback').insert({
        business_id: business.id,
        rating: selected,
        name: name || null,
        email: email || null,
        comment: message || null
      });

      btn.disabled = false;
      btn.textContent = 'Send Private Feedback';

      if(error){
        console.error('Supabase error saving feedback:', error);
        errorEl.textContent = 'Sorry, something went wrong sending your feedback. Please try again.';
        errorEl.style.display = 'block';
        return;
      }

      panelForm.classList.remove('active');
      panelDone.classList.add('active');
    });

    document.getElementById('goToGoogleLow').addEventListener('click', goToGoogle);
    document.getElementById('goToGoogleHigh').addEventListener('click', goToGoogle);
    document.getElementById('goToGoogleAfter').addEventListener('click', () => {
      window.location.href = business.google_review_url;
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  init();
</script>
</body>
</html>
