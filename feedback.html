<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>How was your visit?</title>
</head>
<body>
<script>
  const STORAGE_KEY = "reviewFunnelBusinesses";

  let storageBlocked = false;
  function loadBusinesses(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
    catch(e){ storageBlocked = true; return {}; }
  }

  const BUSINESSES = loadBusinesses();
  const params = new URLSearchParams(window.location.search);
  const bizId = params.get('b');
  const business = bizId ? BUSINESSES[bizId] : null;
</script>

<style>
  :root{
    --ink:#2b2620; --paper:#faf7f2; --panel:#ffffff; --line:#e8e1d6;
    --gold:#c8912b; --gold-dim:#e4d3ad; --calm:#5c6b5a; --calm-bg:#eef1ec; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:32px 20px; -webkit-tap-highlight-color:transparent;
  }
  .card{ width:100%; max-width:420px; text-align:center; }
  h1{ font-size:1.7rem; font-weight:500; line-height:1.3; margin:0 0 6px; letter-spacing:0.2px; }
  .sub{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:0.95rem; color:#6b6255; margin:0 0 32px; }
  .stars{ display:flex; justify-content:center; gap:6px; margin:0 0 8px; }
  .star{
    font-size:2.6rem; line-height:1; color:var(--gold-dim); background:none; border:none;
    padding:4px; cursor:pointer; transition:transform .15s ease, color .15s ease;
  }
  .star:active{ transform:scale(0.88); }
  .star.filled{ color:var(--gold); }
  .hint{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:0.82rem; color:#9a8f7d; min-height:1.2em; margin-bottom:28px; }
  .panel{ display:none; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:26px 22px; text-align:left; animation:rise .35s ease both; }
  .panel.active{ display:block; }
  @keyframes rise{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .panel h2{ font-size:1.15rem; font-weight:500; margin:0 0 8px; }
  .panel p{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:0.92rem; line-height:1.5; color:#4a453c; margin:0 0 18px; }
  textarea{
    width:100%; min-height:96px; resize:vertical; border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:0.95rem;
    color:var(--ink); background:#fcfbf9; margin-bottom:14px;
  }
  textarea:focus{ outline:2px solid var(--calm); outline-offset:1px; border-color:transparent; }
  button.action{
    width:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:0.98rem;
    font-weight:600; padding:14px 18px; border-radius:10px; border:none; cursor:pointer; transition:opacity .15s ease;
  }
  button.action:active{ opacity:0.85; }
  .btn-calm{ background:var(--calm-bg); color:var(--calm); }
  .btn-gold{ background:var(--gold); color:#fff; }
  .thanks{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:0.92rem; color:var(--calm); text-align:center; padding:8px 0 2px; }
  .also-public{ margin-top:16px; padding-top:16px; border-top:1px solid var(--line); }
  .also-public a{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:0.88rem; color:var(--calm); }
  .error{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#9a8f7d; font-size:0.92rem; }
  :focus-visible{ outline:2px solid var(--calm); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ .panel{ animation:none; } .star{ transition:none; } }
</style>

<div class="card" id="card">
  <p class="error">This review page isn't set up yet.</p>
</div>

<script>
  if(!business){
    const card = document.getElementById('card');
    if(storageBlocked){
      card.innerHTML = '<p class="error">This browser is blocking local storage on this page, ' +
        'so the review page can\'t read any saved businesses. This usually means the file was ' +
        'opened directly (a file:// address) instead of through a real web server. Serve this ' +
        'folder (e.g. <code>npx serve .</code>) and open it via http://localhost instead.</p>';
    } else if(!bizId){
      card.innerHTML = '<p class="error">This link is missing a business ID (no <code>?b=</code> in the URL).</p>';
    } else {
      card.innerHTML = '<p class="error">No business found for "' + escapeHtml(bizId) + '". ' +
        'Check it was added on the admin page, and that this page and admin.html are hosted on the same site.</p>';
    }
  }

  if(business){
    document.getElementById('card').innerHTML = `
      <h1>How was your visit?</h1>
      <p class="sub">${escapeHtml(business.BUSINESS_NAME)}</p>

      <div class="stars" id="stars" role="radiogroup" aria-label="Star rating"></div>
      <div class="hint" id="hint">Tap a star to rate us.</div>

      <div class="panel" id="panelLow">
        <h2>Thanks for telling us.</h2>
        <p>We'd love the chance to make this right.</p>
        <textarea id="lowComment" placeholder="What happened, and what can we do better?"></textarea>
        <button class="action btn-calm" id="submitLow">Send feedback</button>
      </div>

      <div class="panel" id="panelHigh">
        <h2>That's great to hear! 🎉</h2>
        <p>Mind sharing it on Google? It takes 30 seconds and helps other customers find ${escapeHtml(business.BUSINESS_NAME)}.</p>
        <button class="action btn-gold" id="goToGoogle">Leave a Google review</button>
      </div>

      <div class="panel" id="panelDone">
        <p class="thanks">Thank you — your feedback has been sent to the team.</p>
      </div>
    `;

    const starsEl = document.getElementById('stars');
    const hint = document.getElementById('hint');
    const panelLow = document.getElementById('panelLow');
    const panelHigh = document.getElementById('panelHigh');
    const panelDone = document.getElementById('panelDone');

    let selected = 0;
    const labels = ["Tap a star to rate us.","Poor","Not great","Okay","Good","Excellent"];

    for(let i=1;i<=5;i++){
      const btn = document.createElement('button');
      btn.className = 'star';
      btn.type = 'button';
      btn.textContent = '★';
      btn.setAttribute('role','radio');
      btn.setAttribute('aria-checked','false');
      btn.setAttribute('aria-label', i + ' star' + (i>1?'s':''));
      btn.addEventListener('click', () => selectRating(i));
      starsEl.appendChild(btn);
    }

    function paintStars(n){
      [...starsEl.children].forEach((el,idx)=>{
        const on = idx < n;
        el.classList.toggle('filled', on);
        el.setAttribute('aria-checked', on ? 'true':'false');
      });
    }

    function logFeedback(rating, comment){
      const log = JSON.parse(localStorage.getItem('feedbackLog') || '[]');
      log.push({ businessId: bizId, rating, comment: comment || null, timestamp: new Date().toISOString() });
      localStorage.setItem('feedbackLog', JSON.stringify(log));
    }

    function selectRating(n){
      selected = n;
      paintStars(n);
      hint.textContent = labels[n];
      panelLow.classList.remove('active');
      panelHigh.classList.remove('active');
      panelDone.classList.remove('active');

      if(n <= 3){
        panelLow.classList.add('active');
      } else {
        logFeedback(n, null);
        panelHigh.classList.add('active');
      }
    }

    document.getElementById('submitLow').addEventListener('click', () => {
      const comment = document.getElementById('lowComment').value.trim();
      logFeedback(selected, comment);
      panelLow.classList.remove('active');
      panelDone.classList.add('active');
    });

    document.getElementById('goToGoogle').addEventListener('click', () => {
      window.location.href = business.GOOGLE_REVIEW_URL;
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>
</body>
</html>
