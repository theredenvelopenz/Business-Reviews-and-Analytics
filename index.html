<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Funnel — Sign in</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#2b2620; --paper:#faf7f2; --panel:#ffffff; --line:#e8e1d6;
    --gold:#c8912b; --calm:#5c6b5a; --calm-bg:#eef1ec;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--paper); color:var(--ink); font-family:var(--sans); padding:20px;
  }
  .card{
    width:100%; max-width:340px; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:28px 26px;
  }
  h1{
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    font-weight:500; font-size:1.4rem; margin:0 0 4px; text-align:center;
  }
  .sub{ color:#6b6255; font-size:0.85rem; text-align:center; margin:0 0 22px; }
  label{ display:block; font-size:0.8rem; font-weight:600; color:#4a453c; margin-bottom:5px; }
  input{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    font-family:var(--sans); font-size:0.92rem; background:#fcfbf9; margin-bottom:14px;
  }
  input:focus{ outline:2px solid var(--calm); outline-offset:1px; border-color:transparent; }
  button{
    width:100%; font-family:var(--sans); font-weight:600; font-size:0.95rem;
    padding:11px; border:none; border-radius:8px; background:var(--gold); color:#fff; cursor:pointer;
  }
  button:disabled{ opacity:0.6; cursor:default; }
  .error{ color:#a4453c; font-size:0.82rem; text-align:center; margin:-6px 0 14px; min-height:1em; }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>Review funnel</h1>
    <p class="sub">Admin sign in</p>

    <label for="user">Username</label>
    <input type="text" id="user" autocomplete="username" autofocus>

    <label for="pass">Password</label>
    <input type="password" id="pass" autocomplete="current-password">

    <p class="error" id="error"></p>

    <button type="submit" id="submitBtn">Sign in</button>
  </form>

<script>
  /* ============================================================
     CONFIG — must match the values in admin.html.
     ============================================================ */
  const SUPABASE_URL = "https://lhhkbycnstsrlqexugoj.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_tEm1Jerp_SGC0SxtckYAjw_QDf-3taq";

  // The visible login is "admin" / your chosen password, but that
  // maps to a real Supabase Auth account behind the scenes — this
  // is the account's actual email, used only for authentication,
  // not a real inbox. Create this exact account in Supabase:
  // Authentication > Users > Add user.
  const ADMIN_USERNAME = "admin";
  const ADMIN_ACCOUNT_EMAIL = "theredenvelopenz@gmail.com";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Already signed in? Skip straight to admin.
  sb.auth.getSession().then(({ data: { session } }) => {
    if(session) window.location.href = 'admin.html';
  });

  const form = document.getElementById('loginForm');
  const errorEl = document.getElementById('error');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.textContent = '';

    const username = document.getElementById('user').value.trim();
    const password = document.getElementById('pass').value;

    if(username.toLowerCase() !== ADMIN_USERNAME){
      errorEl.textContent = 'Incorrect username or password.';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    const { error } = await sb.auth.signInWithPassword({
      email: ADMIN_ACCOUNT_EMAIL,
      password
    });

    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign in';

    if(error){
      errorEl.textContent = 'Incorrect username or password.';
      return;
    }
    window.location.href = 'admin.html';
  });
</script>
</body>
</html>
